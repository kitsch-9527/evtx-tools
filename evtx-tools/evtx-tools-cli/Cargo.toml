[package]
name = "evtx-tools-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "evtx-tools"
path = "src/main.rs"

[dependencies]
evtx-tools-core = { path = "../evtx-tools-core" }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
rayon = "1"
