[package]
name = "evtx-tools-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "evtx_tools_core"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
evtx = "0.12"
serde_yaml = "0.9"
rayon = "1"
sha2 = "0.10"
